<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jansen leg</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11151c; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #panel { position: fixed; left: 16px; top: 16px; color: #e8edf5; background: rgba(10, 14, 20, 0.72);
           padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
  #panel b { display: inline-block; width: 90px; font-weight: 500; color: #8fa3bd; }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="panel">
  <div><b>crank</b><span data-q="crank_deg">0.0°</span></div>
  <div><b>foot x</b><span data-q="foot_x">0.0 mm</span></div>
  <div><b>foot y</b><span data-q="foot_y">0.0 mm</span></div>
</div>
<script type="module">
import * as THREE from 'three';

// ---- parameters (mm, rad/s). Jansen "holy numbers" for one leg, 11 links ----
const P = {
  O: [0, 0],
  X: [-7.8, 0],
  len: { OZ: 38, ZY: 41.5, XY: 39.3, ZW: 40.1, XW: 55.8, XV: 39.4, YV: 36.7, VU: 65.7, WU: 49.0, UT: 50.0, WT: 61.9 },
  omega: Math.PI / 2,
  theta0: 0,
};
const LEN = P.len;
const period = 2 * Math.PI / P.omega;

// Both intersections of circle(p0, r0) and circle(p1, r1).
// [0] is on the left of p0 -> p1, [1] on the right.
function circ2(p0, r0, p1, r1) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
  const d = Math.hypot(dx, dy);
  const a = (r0 * r0 - r1 * r1 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r0 * r0 - a * a));
  const ux = dx / d, uy = dy / d;
  const mx = p0[0] + a * ux, my = p0[1] + a * uy;
  return [[mx - h * uy, my + h * ux], [mx + h * uy, my - h * ux]];
}

// Pick the intersection closest to the previous solution (continuous assembly branch).
// With no previous solution (start pose) take the left branch.
function near(cands, ref) {
  if (!ref) return cands[0];
  const d0 = (cands[0][0] - ref[0]) ** 2 + (cands[0][1] - ref[1]) ** 2;
  const d1 = (cands[1][0] - ref[0]) ** 2 + (cands[1][1] - ref[1]) ** 2;
  return d0 <= d1 ? cands[0] : cands[1];
}

// Kinematics of the leg at crank angle th, given the previous joint solution.
function solveStep(th, prev) {
  const Z = [LEN.OZ * Math.cos(th), LEN.OZ * Math.sin(th)];
  const O = P.O, X = P.X;
  const Y = near(circ2(Z, LEN.ZY, X, LEN.XY), prev && prev.Y);   // upper crank rod meets upper triangle
  const W = near(circ2(Z, LEN.ZW, X, LEN.XW), prev && prev.W);   // lower crank rod meets link from X
  // apex of rigid upper triangle X-Y-V. At the start pose the first candidate lands ~7 mm from the
  // crank pin Z (folded, overlapping); take the other branch there, then follow it continuously.
  const VC = circ2(X, LEN.XV, Y, LEN.YV);
  const V = prev ? near(VC, prev.V) : VC[1];
  const U = near(circ2(V, LEN.VU, W, LEN.WU), prev && prev.U);   // knee
  const T = near(circ2(W, LEN.WT, U, LEN.UT), prev && prev.T);   // foot, rigid leg triangle W-U-T
  return { th, O, X, Z, Y, V, W, U, T };
}

// Full kinematics at crank time t. Pure function of t: the linkage is integrated
// from theta0 to the crank angle in small steps, following the branch continuously
// so the knee and foot never jump to the other assembly mode.
function pose(t) {
  const total = P.omega * t;
  const N = Math.max(1, Math.ceil(Math.abs(total) / 0.01));
  let s = solveStep(P.theta0, null);
  for (let i = 1; i <= N; i++) {
    s = solveStep(P.theta0 + total * i / N, s);
  }
  return s;
}

// Part definitions: points (first point = body origin), colour, z layer, plate or bar
const PARTS = {
  frame:          { pts: ['O', 'X'],     color: 0x6b7280, z: -14, plate: false, w: 12, d: 6 },
  crank:          { pts: ['O', 'Z'],     color: 0xf59e0b, z: -8,  plate: false, w: 8,  d: 4 },
  rodLower:       { pts: ['Z', 'W'],     color: 0x14b8a6, z: -3,  plate: false, w: 7,  d: 4 },
  linkXW:         { pts: ['X', 'W'],     color: 0xa78bfa, z: -3,  plate: false, w: 7,  d: 4 },
  rodUpper:       { pts: ['Z', 'Y'],     color: 0x3b82f6, z: 3,   plate: false, w: 7,  d: 4 },
  upperTriangle:  { pts: ['X', 'Y', 'V'], color: 0x22c55e, z: 3,  plate: true,  d: 4 },
  linkVU:         { pts: ['V', 'U'],     color: 0xef4444, z: 9,   plate: false, w: 7,  d: 4 },
  legTriangle:    { pts: ['W', 'U', 'T'], color: 0xeab308, z: 9,  plate: true,  d: 4 },
};

// ---- renderer, scene, camera, lights ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151c);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(60, -400, 330);
camera.lookAt(-10, -20, 0);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x202431, 0.9));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(120, -200, 300);
scene.add(sun);

const grid = new THREE.GridHelper(420, 21, 0x3a4456, 0x242b38);
grid.rotation.x = Math.PI / 2;
grid.position.z = -40;
scene.add(grid);

// ---- build parts ----
const ref = pose(0);
const groups = {};
const refAng = {};
const pinMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.25 });

function mat(c) {
  return new THREE.MeshStandardMaterial({ color: c, metalness: 0.3, roughness: 0.45, side: THREE.DoubleSide });
}

function bar(g, a, b, color, z, w, d) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, w, d), mat(color));
  m.position.set((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, z);
  m.rotation.z = Math.atan2(dy, dx);
  g.add(m);
}

function pin(g, p, z, h) {
  const geo = new THREE.CylinderGeometry(3, 3, h, 20);
  geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, pinMat);
  m.position.set(p[0], p[1], z);
  g.add(m);
}

for (const name of Object.keys(PARTS)) {
  const { pts, color, z, plate, w, d } = PARTS[name];
  const g = new THREE.Object3D();
  g.name = name;
  scene.add(g);
  groups[name] = g;

  const wr = pts.map(n => ref[n]);
  refAng[name] = Math.atan2(wr[1][1] - wr[0][1], wr[1][0] - wr[0][0]);
  // rigid local coordinates: origin at the first point, unrotated
  const loc = wr.map(p => [p[0] - wr[0][0], p[1] - wr[0][1]]);

  if (plate) {
    const shape = new THREE.Shape();
    shape.moveTo(loc[0][0], loc[0][1]);
    for (let i = 1; i < loc.length; i++) shape.lineTo(loc[i][0], loc[i][1]);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
    geo.translate(0, 0, -d / 2);
    const m = new THREE.Mesh(geo, mat(color));
    m.position.z = z;
    g.add(m);
    for (const p of loc) pin(g, p, z, d + 4);
  } else {
    bar(g, loc[0], loc[1], color, z, w, d);
    pin(g, loc[0], z, d + 4);
    pin(g, loc[1], z, d + 4);
  }

  // one marker per (part, point), placed exactly at that point
  pts.forEach((n, i) => {
    const mk = new THREE.Object3D();
    mk.name = `${name}@${n}`;
    mk.position.set(loc[i][0], loc[i][1], 0);
    g.add(mk);
  });
}

// foot tip indicator on the leg triangle
{
  const tipLoc = [ref.T[0] - ref.W[0], ref.T[1] - ref.W[1]];
  const tip = new THREE.Mesh(new THREE.SphereGeometry(3.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  tip.position.set(tipLoc[0], tipLoc[1], 9);
  groups.legTriangle.add(tip);
}

// static foot-path trace over one period (scene decoration, not a part)
{
  const N = 240, trail = [];
  for (let i = 0; i <= N; i++) {
    const q = pose(period * i / N);
    trail.push(new THREE.Vector3(q.T[0], q.T[1], 0));
  }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(trail),
    new THREE.LineBasicMaterial({ color: 0xffd166 }));
  scene.add(line);
}

// ---- panel ----
const q = {};
document.querySelectorAll('[data-q]').forEach(el => { q[el.dataset.q] = el; });

// ---- pure render: pose everything for time t and draw ----
function render(t) {
  const p = pose(t);
  for (const name of Object.keys(PARTS)) {
    const pts = PARTS[name].pts;
    const w0 = p[pts[0]], w1 = p[pts[1]];
    const g = groups[name];
    g.position.set(w0[0], w0[1], 0);
    g.rotation.set(0, 0, Math.atan2(w1[1] - w0[1], w1[0] - w0[0]) - refAng[name]);
  }
  const deg = ((p.th * 180 / Math.PI) % 360 + 360) % 360;
  q.crank_deg.textContent = `${deg.toFixed(1)}°`;
  q.foot_x.textContent = `${p.T[0].toFixed(1)} mm`;
  q.foot_y.textContent = `${p.T[1].toFixed(1)} mm`;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.SIM = {
  scene,
  camera,
  renderer,
  period,
  params: {
    O: P.O,
    X: P.X,
    len: { ...LEN },
    omega: P.omega,
    theta0: P.theta0,
  },
  render,
};

render(0);
window.SIM_READY = true;

// ---- live loop (skipped for capture) ----
if (!location.href.includes('?capture')) {
  const start = performance.now();
  const loop = (now) => {
    window.SIM.render((now - start) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
