<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jansen Leg Simulator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; font-family: system-ui, sans-serif; color: #e5e7eb; }
  canvas { display: block; }
  #panel { position: fixed; left: 12px; top: 12px; background: rgba(0, 0, 0, 0.55); padding: 10px 14px; border-radius: 6px; font-size: 14px; line-height: 1.6; }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="panel">
  <div>crank angle: <span data-q="crank_deg">0.00 deg</span></div>
  <div>foot x: <span data-q="foot_x">0.00 mm</span></div>
  <div>foot y: <span data-q="foot_y">0.00 mm</span></div>
</div>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Geometry. Lengths (mm) from Jansen's published "holy numbers":
// M=15 OZ (crank), J=50 ZY, B=41.5 XY, K=61.9 ZW, C=39.3 XW, D=40.1 XV,
// E=55.8 YV, F=39.4 VU, G=36.7 WU, H=65.7 UT, I=49 WT.
// The second ground pivot X sits at A=38 to the side of O and L=7.8 below it.
// ---------------------------------------------------------------------------
const TWO_PI = Math.PI * 2;
const L = { OZ: 15, ZY: 50, XY: 41.5, ZW: 61.9, XW: 39.3, XV: 40.1, YV: 55.8, VU: 39.4, WU: 36.7, UT: 65.7, WT: 49 };
const O = [0, 0];
const X = [-38, -7.8];
const OMEGA = 1.0;      // rad/s, counter-clockwise
const THETA0 = 0;       // reference pose is the crank at angle 0

const mod2pi = (v) => ((v % TWO_PI) + TWO_PI) % TWO_PI;

// Unknowns: Y, V, W, U, T (10 scalars). Z is driven by the crank.
const IDX = { Y: 0, V: 2, W: 4, U: 6, T: 8 };
const CONS = [
  ['Z', 'Y', L.ZY], ['X', 'Y', L.XY], ['X', 'V', L.XV], ['Y', 'V', L.YV],
  ['Z', 'W', L.ZW], ['X', 'W', L.XW], ['V', 'U', L.VU], ['W', 'U', L.WU],
  ['U', 'T', L.UT], ['W', 'T', L.WT]
];

function pointsOf(x, th) {
  return {
    O, X,
    Z: [L.OZ * Math.cos(th), L.OZ * Math.sin(th)],
    Y: [x[0], x[1]], V: [x[2], x[3]], W: [x[4], x[5]], U: [x[6], x[7]], T: [x[8], x[9]]
  };
}

function resJac(x, th) {
  const P = pointsOf(x, th);
  const r = new Array(10);
  const J = [];
  for (let k = 0; k < 10; k++) J.push(new Array(10).fill(0));
  CONS.forEach(([a, b, d], k) => {
    const pa = P[a], pb = P[b];
    const dx = pa[0] - pb[0], dy = pa[1] - pb[1];
    r[k] = dx * dx + dy * dy - d * d;
    if (a in IDX) { J[k][IDX[a]] += 2 * dx; J[k][IDX[a] + 1] += 2 * dy; }
    if (b in IDX) { J[k][IDX[b]] -= 2 * dx; J[k][IDX[b] + 1] -= 2 * dy; }
  });
  return { r, J };
}

function solveLin(A, b) {
  const n = b.length;
  const M = A.map((row, i) => row.slice().concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    const tmp = M[c]; M[c] = M[p]; M[p] = tmp;
    const piv = M[c][c];
    if (Math.abs(piv) < 1e-14) return null;
    for (let r = c + 1; r < n; r++) {
      const f = M[r][c] / piv;
      if (f !== 0) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  const xs = new Array(n).fill(0);
  for (let r = n - 1; r >= 0; r--) {
    let s = M[r][n];
    for (let k = r + 1; k < n; k++) s -= M[r][k] * xs[k];
    xs[r] = s / M[r][r];
  }
  return xs;
}

function resNorm(r) {
  let e = 0;
  for (const v of r) e = Math.max(e, Math.abs(v));
  return e;
}

// Damped Gauss-Newton on the closed-loop constraints at crank angle th.
// Solves the normal equations (J'J + eps I) dx = -J'r and backtracks so a step
// is accepted only if the worst residual decreases: the solver cannot jump to
// a far-away non-solution (the earlier plain Newton blew up near singular poses).
function newton(x0, th) {
  let x = x0.slice();
  let st = resJac(x, th);
  let e = resNorm(st.r);
  for (let it = 0; it < 60 && e > 1e-10; it++) {
    const r = st.r, J = st.J;
    const JtJ = [];
    const Jtr = new Array(10).fill(0);
    for (let i = 0; i < 10; i++) {
      JtJ.push(new Array(10).fill(0));
      for (let j = 0; j < 10; j++) {
        let acc = 0;
        for (let k = 0; k < 10; k++) acc += J[k][i] * J[k][j];
        JtJ[i][j] = acc + (i === j ? 1e-10 : 0);
      }
      let g = 0;
      for (let k = 0; k < 10; k++) g -= J[k][i] * r[k];
      Jtr[i] = g;
    }
    const dx = solveLin(JtJ, Jtr);
    if (!dx) break;
    let step = 1, moved = false;
    for (let bt = 0; bt < 30; bt++, step *= 0.5) {
      const xn = x.map((v, i) => v + step * dx[i]);
      const sn = resJac(xn, th);
      const en = resNorm(sn.r);
      if (en < e) { x = xn; st = sn; e = en; moved = true; break; }
    }
    if (!moved) break;
  }
  return x;
}

// Closed-form kinematics: each joint is the intersection of two circles around
// points already known (Z from the crank; Y, W from Z and X; V from X and Y;
// U from V and W; T from U and W). Each step takes the intersection nearest the
// previous step, so the assembly never jumps branch and every constraint holds.
function circ2(c1, r1, c2, r2) {
  const dx = c2[0] - c1[0], dy = c2[1] - c1[1];
  const d = Math.hypot(dx, dy);
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  const px = c1[0] + a * dx / d, py = c1[1] + a * dy / d;
  return [[px - h * dy / d, py + h * dx / d], [px + h * dy / d, py - h * dx / d]];
}
const dist2 = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
const pick = (cands, prev, better) => {
  if (prev) return cands.reduce((b, c) => (dist2(c, prev) < dist2(b, prev) ? c : b));
  return cands.reduce((b, c) => (better(c, b) ? c : b));
};
const up = (c, b) => c[1] > b[1];
const down = (c, b) => c[1] < b[1];
const outer = (c, b) => Math.hypot(c[0], c[1]) > Math.hypot(b[0], b[1]);

// One assembly step at crank angle th. prev = joints of the previous step (null at start).
function advance(prev, th) {
  const Z = [L.OZ * Math.cos(th), L.OZ * Math.sin(th)];
  const g = (k) => (prev ? prev[k] : null);
  const Y = pick(circ2(Z, L.ZY, X, L.XY), g('Y'), up);
  const W = pick(circ2(Z, L.ZW, X, L.XW), g('W'), down);
  const V = pick(circ2(X, L.XV, Y, L.YV), g('V'), outer);
  const U = pick(circ2(V, L.VU, W, L.WU), g('U'), outer);
  const T = pick(circ2(U, L.UT, W, L.WT), g('T'), down);
  return { Z, Y, V, W, U, T };
}

// Joints at crank angle th (rad), continued from the reference in 0.5-degree steps.
// Depends only on th and constants: no state is kept between calls.
function jointsAt(th) {
  const N = 720;
  let P = advance(null, 0);
  for (let k = 1; k <= N; k++) P = advance(P, th * k / N);
  return P;
}
const fullPose = (th) => {
  const P = jointsAt(th);
  return { O, X, Z: P.Z, Y: P.Y, V: P.V, W: P.W, U: P.U, T: P.T };
};

// Reference pose (crank angle 0).
const REF = fullPose(0);

// Foot trace over one revolution (constant, computed once at load).
const TRACE = [];
{
  let P = advance(null, 0);
  for (let k = 0; k <= 720; k++) {
    if (k > 0) P = advance(P, TWO_PI * k / 720);
    TRACE.push(new THREE.Vector3(P.T[0], P.T[1], -1));
  }
}

// ---------------------------------------------------------------------------
// Scene
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(0, -15, 300);
camera.lookAt(-5, -20, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(120, 160, 300);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8899ff, 0.35);
fill.position.set(-200, -100, 150);
scene.add(fill);

const WB = 6;   // bar width (mm)
const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.15 });

const objs = {};
// Create a part Object3D. Its local frame is anchored at `anchor` and
// oriented so that the reference direction anchor->dir is along +X.
function makePart(name, anchor, dir, pts) {
  const g = new THREE.Object3D();
  g.name = name;
  const a = anchor ? REF[anchor] : [0, 0];
  const L2 = (p) => [REF[p][0] - a[0], REF[p][1] - a[1]];
  for (const p of pts) {
    const mk = new THREE.Object3D();
    mk.name = name + '@' + p;
    const q = L2(p);
    mk.position.set(q[0], q[1], 0);
    g.add(mk);
  }
  scene.add(g);
  objs[name] = { g, anchor, dir, L2 };
  return objs[name];
}

function bar(g, p, q, z, depth, color) {
  const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, WB, depth), mat(color));
  m.position.set((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, z);
  m.rotation.z = Math.atan2(q[1] - p[1], q[0] - p[0]);
  g.add(m);
}

function plate(g, pts, z, depth, color) {
  const shape = new THREE.Shape(pts.map((p) => new THREE.Vector2(p[0], p[1])));
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  geo.translate(0, 0, -depth / 2);
  const m = new THREE.Mesh(geo, mat(color));
  m.position.z = z;
  g.add(m);
}

function pin(g, p, color) {
  const geo = new THREE.CylinderGeometry(3.4, 3.4, 30, 20);
  geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, mat(color));
  m.position.set(p[0], p[1], 0);
  g.add(m);
}

// frame (fixed, world coordinates)
{
  const P = makePart('frame', null, null, ['O', 'X']);
  const L2 = P.L2;
  bar(P.g, L2('O'), L2('X'), 0, 8, 0x6b7280);
  pin(P.g, L2('O'), 0x9ca3af);
  pin(P.g, L2('X'), 0x9ca3af);
}
// crank
{
  const P = makePart('crank', 'O', 'Z', ['O', 'Z']);
  bar(P.g, P.L2('O'), P.L2('Z'), 0, 6, 0xf59e0b);
  pin(P.g, P.L2('O'), 0xfde68a);
  pin(P.g, P.L2('Z'), 0xfde68a);
}
// rodUpper (Z -> Y)
{
  const P = makePart('rodUpper', 'Z', 'Y', ['Z', 'Y']);
  bar(P.g, P.L2('Z'), P.L2('Y'), 8, 5, 0x60a5fa);
  pin(P.g, P.L2('Z'), 0xbfdbfe);
  pin(P.g, P.L2('Y'), 0xbfdbfe);
}
// rodLower (Z -> W)
{
  const P = makePart('rodLower', 'Z', 'W', ['Z', 'W']);
  bar(P.g, P.L2('Z'), P.L2('W'), -8, 5, 0x34d399);
  pin(P.g, P.L2('Z'), 0xa7f3d0);
  pin(P.g, P.L2('W'), 0xa7f3d0);
}
// upperTriangle (X, Y, V)
{
  const P = makePart('upperTriangle', 'X', 'Y', ['X', 'Y', 'V']);
  plate(P.g, [P.L2('X'), P.L2('Y'), P.L2('V')], 8, 5, 0xa78bfa);
  pin(P.g, P.L2('X'), 0xddd6fe);
  pin(P.g, P.L2('Y'), 0xddd6fe);
  pin(P.g, P.L2('V'), 0xddd6fe);
}
// linkXW (X -> W)
{
  const P = makePart('linkXW', 'X', 'W', ['X', 'W']);
  bar(P.g, P.L2('X'), P.L2('W'), -8, 5, 0xf472b6);
  pin(P.g, P.L2('X'), 0xfbcfe8);
  pin(P.g, P.L2('W'), 0xfbcfe8);
}
// linkVU (V -> U)
{
  const P = makePart('linkVU', 'V', 'U', ['V', 'U']);
  bar(P.g, P.L2('V'), P.L2('U'), 0, 5, 0xfb7185);
  pin(P.g, P.L2('V'), 0xfecdd3);
  pin(P.g, P.L2('U'), 0xfecdd3);
}
// legTriangle (W, U, T)
{
  const P = makePart('legTriangle', 'W', 'U', ['W', 'U', 'T']);
  plate(P.g, [P.L2('W'), P.L2('U'), P.L2('T')], -8, 5, 0xfacc15);
  pin(P.g, P.L2('W'), 0xfef08a);
  pin(P.g, P.L2('U'), 0xfef08a);
  pin(P.g, P.L2('T'), 0xfef08a);
}

// Foot trace (not a part; visual aid only)
{
  const tg = new THREE.BufferGeometry().setFromPoints(TRACE);
  const trace = new THREE.Line(tg, new THREE.LineBasicMaterial({ color: 0xfbbf24 }));
  trace.name = 'footPath';
  scene.add(trace);
}

// Rigid placement of every moving part from the current points.
function applyPose(P) {
  for (const name in objs) {
    const s = objs[name];
    if (!s.anchor) continue;
    const A = P[s.anchor], Q = P[s.dir];
    const ra = REF[s.anchor], rq = REF[s.dir];
    const ang = Math.atan2(Q[1] - A[1], Q[0] - A[0]) - Math.atan2(rq[1] - ra[1], rq[0] - ra[0]);
    s.g.position.set(A[0], A[1], 0);
    s.g.rotation.set(0, 0, ang);
  }
}

const panelEls = {};
document.querySelectorAll('[data-q]').forEach((el) => { panelEls[el.dataset.q] = el; });

function render(t) {
  const th = mod2pi(THETA0 + OMEGA * t);
  const P = fullPose(th);
  applyPose(P);
  panelEls.crank_deg.textContent = ((th * 180 / Math.PI) % 360).toFixed(2) + ' deg';
  panelEls.foot_x.textContent = P.T[0].toFixed(2) + ' mm';
  panelEls.foot_y.textContent = P.T[1].toFixed(2) + ' mm';
  renderer.render(scene, camera);
}

window.SIM = {
  scene,
  camera,
  renderer,
  period: TWO_PI / OMEGA,
  params: { O, X, len: { ...L }, omega: OMEGA, theta0: THETA0 },
  render
};
render(0);
window.SIM_READY = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (window.location.search.indexOf('capture') < 0) {
  const t0 = performance.now();
  const frame = () => {
    render((performance.now() - t0) / 1000);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
