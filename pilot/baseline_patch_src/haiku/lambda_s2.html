<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chebyshev lambda linkage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; color: #e8eaf0; font-family: system-ui, sans-serif; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  #panel {
    position: fixed; z-index: 10; left: 16px; top: 16px;
    background: rgba(20, 22, 28, 0.8); border: 1px solid #3a3f4b; border-radius: 8px;
    padding: 12px 14px; font-size: 14px; line-height: 1.7; min-width: 210px;
  }
  #panel .lbl { color: #9fb4d9; display: inline-block; width: 110px; }
  #panel .unit { color: #9aa3b2; margin-left: 4px; }
</style>
</head>
<body>
<div id="panel">
  <div><span class="lbl">Crank angle</span><span data-q="crank_deg">0.0</span><span class="unit">deg</span></div>
  <div><span class="lbl">P x</span><span data-q="P_x">0.0</span><span class="unit">mm</span></div>
  <div><span class="lbl">P y</span><span data-q="P_y">0.0</span><span class="unit">mm</span></div>
</div>

<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// Chebyshev lambda linkage. Proportions a:b:c:d = 1:2.5:2:2.5 (crank:coupler:rocker:frame), scaled to mm.
const PARAMS = {
  O2: [0, 0],
  O4: [80, 0],
  len: { O2A: 40, O4B: 100, AB: 100, AP: 200 },
  omega: 1.0,      // rad/s, counter-clockwise positive
  theta0: 0        // rad, crank angle O2->A at t = 0
};

const O2 = PARAMS.O2, O4 = PARAMS.O4, L = PARAMS.len;

// Closed-form pose of the four-bar at crank angle theta.
// Upper branch of the coupler/rocker circle intersection (max y); this branch is continuous
// over a full crank revolution for these proportions, and the two candidates never tie.
function pose(theta) {
  const ax = O2[0] + L.O2A * Math.cos(theta);
  const ay = O2[1] + L.O2A * Math.sin(theta);
  const vx = O4[0] - ax, vy = O4[1] - ay;
  const d = Math.hypot(vx, vy);
  const aa = (L.AB * L.AB - L.O4B * L.O4B + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(L.AB * L.AB - aa * aa, 0));
  const mx = ax + aa * vx / d, my = ay + aa * vy / d;
  const nx = -vy / d, ny = vx / d;
  let bx = mx + h * nx, by = my + h * ny;
  const bx2 = mx - h * nx, by2 = my - h * ny;
  if (by2 > by) { bx = bx2; by = by2; }
  const psi = Math.atan2(by - ay, bx - ax);      // coupler direction A->B
  const phi = Math.atan2(by - O4[1], bx - O4[0]); // rocker direction O4->B
  const tx = ax + L.AP * Math.cos(psi);           // tracing point P on the extended coupler
  const ty = ay + L.AP * Math.sin(psi);
  return { ax, ay, bx, by, psi, phi, tx, ty };
}

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(50, -170, 420);
camera.lookAt(50, 10, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x202028, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(120, -200, 300);
scene.add(sun);

const grid = new THREE.GridHelper(400, 40, 0x3a4150, 0x262b35);
grid.rotation.x = Math.PI / 2;
grid.position.set(50, 0, -12);
scene.add(grid);

function mat(color) {
  return new THREE.MeshStandardMaterial({ color, metalness: 0.35, roughness: 0.45 });
}
// Link bar along local +X from x0 to x1, centred at height z (thickness along Z).
function bar(group, x0, x1, z, color, w = 10, depth = 6) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, w, depth), mat(color));
  m.position.set((x0 + x1) / 2, 0, z);
  group.add(m);
}
// Vertical pin (cylinder along Z) at local x.
function pin(group, x, z0, z1, r, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, z1 - z0, 28), mat(color));
  m.rotation.x = Math.PI / 2;
  m.position.set(x, 0, (z0 + z1) / 2);
  group.add(m);
}
// Hub disc at local x.
function hub(group, x, z, r, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 8, 28), mat(color));
  m.rotation.x = Math.PI / 2;
  m.position.set(x, 0, z);
  group.add(m);
}
// Empty marker object named "<part>@<point>" at a local point (in-plane, z = 0).
function marker(group, name, x, y = 0) {
  const o = new THREE.Object3D();
  o.name = name;
  o.position.set(x, y, 0);
  group.add(o);
}
function part(name, x, y) {
  const g = new THREE.Group();
  g.name = name;
  g.position.set(x, y, 0);
  scene.add(g);
  return g;
}

// frame: O2 at origin of its group, O4 along local +X
const frameLen = Math.hypot(O4[0] - O2[0], O4[1] - O2[1]);
const frame = part('frame', O2[0], O2[1]);
frame.rotation.z = Math.atan2(O4[1] - O2[1], O4[0] - O2[0]);
bar(frame, 0, frameLen, 0, 0x7d8594, 12, 6);
pin(frame, 0, -8, 36, 6, 0xc9ced8);
pin(frame, frameLen, -8, 36, 6, 0xc9ced8);
// ground pads
for (const x of [0, frameLen]) {
  const pad = new THREE.Mesh(new THREE.BoxGeometry(22, 22, 4), mat(0x4a5160));
  pad.position.set(x, 0, -10);
  frame.add(pad);
}
marker(frame, 'frame@O2', 0);
marker(frame, 'frame@O4', frameLen);

// crank: O2 -> A, length O2A
const crank = part('crank', O2[0], O2[1]);
bar(crank, 0, L.O2A, 10, 0xf0a04b);
hub(crank, 0, 10, 8, 0xf7c27f);
hub(crank, L.O2A, 10, 8, 0xf7c27f);
pin(crank, L.O2A, 7, 24, 4, 0xffe2b8);
marker(crank, 'crank@O2', 0);
marker(crank, 'crank@A', L.O2A);

// coupler: A -> B (AB), extended to tracer P (AP)
const coupler = part('coupler', O2[0] + L.O2A, O2[1]);
bar(coupler, 0, L.AB, 20, 0x4b9ef0);
bar(coupler, L.AB, L.AP, 20, 0x9fc9f7, 5, 4);
hub(coupler, 0, 20, 8, 0x8cc0f5);
hub(coupler, L.AB, 20, 8, 0x8cc0f5);
pin(coupler, L.AP, 16, 30, 4, 0xff6b6b);
marker(coupler, 'coupler@A', 0);
marker(coupler, 'coupler@B', L.AB);
marker(coupler, 'coupler@P', L.AP);

// rocker: O4 -> B, length O4B
const rocker = part('rocker', O4[0], O4[1]);
bar(rocker, 0, L.O4B, 30, 0x5fd08a);
hub(rocker, 0, 30, 8, 0x9be6b8);
hub(rocker, L.O4B, 30, 8, 0x9be6b8);
pin(rocker, L.O4B, 17, 34, 4, 0xc8f5da);
marker(rocker, 'rocker@O4', 0);
marker(rocker, 'rocker@B', L.O4B);

// coupler-point trace (pure function of the parameters, drawn once)
{
  const pts = [];
  for (let k = 0; k <= 360; k++) {
    const p = pose(PARAMS.theta0 + (2 * Math.PI * k) / 360);
    pts.push(new THREE.Vector3(p.tx, p.ty, -1));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x66d9ef }));
  line.name = 'trace';
  scene.add(line);
}

// ---------- panel ----------
const qEl = (name) => document.querySelector(`[data-q="${name}"]`);
const elCrank = qEl('crank_deg'), elPx = qEl('P_x'), elPy = qEl('P_y');

function fmt1(v) {
  const s = v.toFixed(1);
  return s === '-0.0' ? '0.0' : s;
}

// ---------- render(t): pure function of t ----------
function render(t) {
  const theta = PARAMS.theta0 + PARAMS.omega * t;
  const p = pose(theta);

  crank.rotation.z = theta;
  coupler.position.set(p.ax, p.ay, 0);
  coupler.rotation.z = p.psi;
  rocker.rotation.z = p.phi;

  let deg = ((theta * 180 / Math.PI) % 360 + 360) % 360;
  let degStr = deg.toFixed(1);
  if (degStr === '360.0') degStr = '0.0';
  elCrank.textContent = degStr;
  elPx.textContent = fmt1(p.tx);
  elPy.textContent = fmt1(p.ty);

  renderer.render(scene, camera);
}

window.SIM = {
  scene,
  camera,
  renderer,
  period: 2 * Math.PI / PARAMS.omega,
  params: PARAMS,
  render
};

render(0);
window.SIM_READY = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  render(0);
});

if (!location.search.includes('capture')) {
  const start = performance.now();
  const loop = () => {
    render((performance.now() - start) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
