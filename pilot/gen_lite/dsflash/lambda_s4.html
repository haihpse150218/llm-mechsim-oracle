<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chebyshev Lambda Linkage — 3D Simulator</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #06090e;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px;
    padding: 12px 16px 13px;
    border-radius: 12px;
    background: rgba(10, 18, 30, .74);
    border: 1px solid rgba(90, 160, 240, .25);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
    color: #cfe2f7;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: .02em;
    pointer-events: none;
    user-select: none;
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }
  #hud .title {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: #6fa8dd; margin-bottom: 6px;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 18px; }
  #hud .lbl { color: #7e9bb8; }
  #hud .val { color: #ffd977; font-weight: 600; font-variant-numeric: tabular-nums; }
  #hud .unt { color: #55708c; }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="hud">
  <div class="title">Chebyshev &lambda; Linkage</div>
  <div class="row"><span class="lbl">crank</span><span><span class="val" data-q="crank_deg">0.0</span> <span class="unt">deg</span></span></div>
  <div class="row"><span class="lbl">P.x</span><span><span class="val" data-q="P_x">0.00</span> <span class="unt">mm</span></span></div>
  <div class="row"><span class="lbl">P.y</span><span><span class="val" data-q="P_y">0.00</span> <span class="unt">mm</span></span></div>
</div>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   PARAMETERS  (1 scene unit = 1 mm, motion in world XY plane)
   Chebyshev-style lambda proportions:
     crank O2A = 1,  coupler AB = 3,  rocker O4B = 3,  ground O2O4 = 2,
     tracing point P beyond B with AP = 6.
   Grashof: s + l = 1 + 3 = 4  <=  3 + 2 = 5   ->  crank fully rotates.
   ================================================================ */
const PARAMS = {
  O2: [0, 0],
  O4: [2, 0],
  len: { O2A: 1, O4B: 3, AB: 3, AP: 6 },
  omega: 1.2,          // rad/s, counter-clockwise positive
  theta0: 0            // crank angle at t = 0
};

/* ================================================================
   KINEMATICS  — pure function of the crank angle
   ================================================================ */
function solve(theta) {
  const a  = PARAMS.len.O2A;
  const b  = PARAMS.len.AB;
  const c  = PARAMS.len.O4B;
  const ap = PARAMS.len.AP;

  const A = {
    x: PARAMS.O2[0] + a * Math.cos(theta),
    y: PARAMS.O2[1] + a * Math.sin(theta)
  };

  // B = intersection of circle(A, b) and circle(O4, c) — stable branch
  const dx = PARAMS.O4[0] - A.x;
  const dy = PARAMS.O4[1] - A.y;
  const L  = Math.hypot(dx, dy);
  const ex = dx / L;
  const ey = dy / L;
  const along = (L * L + b * b - c * c) / (2 * L);
  const hgt   = Math.sqrt(Math.max(0, b * b - along * along));

  const B = {
    x: A.x + along * ex - hgt * ey,
    y: A.y + along * ey + hgt * ex
  };

  // P on the coupler line, beyond B
  const ux = (B.x - A.x) / b;
  const uy = (B.y - A.y) / b;
  const P  = { x: A.x + ap * ux, y: A.y + ap * uy };

  return { A, B, P };
}

/* ================================================================
   RENDERER / SCENE / CAMERA
   ================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06090e);

const camera = new THREE.PerspectiveCamera(
  45, window.innerWidth / window.innerHeight, 0.1, 600
);

const camTarget = new THREE.Vector3(2.0, 2.6, 0);
const camDir    = new THREE.Vector3(0.12, 0.16, 1).normalize();

function fitCamera() {
  const fov = (camera.fov * Math.PI) / 180;
  const halfH = 4.25;
  const halfW = 3.85;
  const aspect = camera.aspect;
  const dH = halfH / Math.tan(fov / 2);
  const dW = halfW / (Math.tan(fov / 2) * aspect);
  const d  = Math.max(dH, dW);
  camera.position.copy(camTarget).addScaledVector(camDir, d);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}

/* ---------------- lighting ---------------- */
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x101a26, 1.35));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(5, 7, 11);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7fa8ff, 1.0);
fillLight.position.set(-7, -3, 7);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffcaa0, 0.9);
rimLight.position.set(-4, 6, -9);
scene.add(rimLight);

/* ---------------- materials ---------------- */
const MAT = {
  frame:   new THREE.MeshStandardMaterial({ color: 0x4a5a72, metalness: 0.55, roughness: 0.55 }),
  crank:   new THREE.MeshStandardMaterial({ color: 0xe05a48, metalness: 0.35, roughness: 0.38 }),
  coupler: new THREE.MeshStandardMaterial({ color: 0x2fbf87, metalness: 0.35, roughness: 0.38 }),
  rocker:  new THREE.MeshStandardMaterial({ color: 0x4a8ee0, metalness: 0.35, roughness: 0.38 }),
  pin:     new THREE.MeshStandardMaterial({ color: 0xdfe9f6, metalness: 0.85, roughness: 0.22 }),
  trace:   new THREE.MeshStandardMaterial({ color: 0xffd166, metalness: 0.55, roughness: 0.28,
                                            emissive: 0x3a2800, emissiveIntensity: 1.0 })
};

/* ---------------- small builders ---------------- */
function addBar(parent, x0, x1, width, depth, material, z) {
  const len = Math.abs(x1 - x0);
  const geo = new THREE.BoxGeometry(len, width, depth);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set((x0 + x1) / 2, 0, z || 0);
  parent.add(mesh);
  return mesh;
}

function addPin(parent, x, y, radius, height, material, z) {
  const geo = new THREE.CylinderGeometry(radius, radius, height, 26);
  geo.rotateX(Math.PI / 2);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z || 0);
  parent.add(mesh);
  return mesh;
}

function addMarker(parent, name, x, y, z) {
  const o = new THREE.Object3D();
  o.name = name;
  o.position.set(x, y, z || 0);
  parent.add(o);
  return o;
}

/* ================================================================
   PART: frame  (ground pivots O2 and O4)
   ================================================================ */
const frame = new THREE.Object3D();
frame.name = 'frame';
scene.add(frame);

{
  // base plate under the two ground pivots
  const midX = (PARAMS.O2[0] + PARAMS.O4[0]) / 2;
  const plate = new THREE.Mesh(
    new THREE.BoxGeometry(3.6, 1.0, 0.55),
    MAT.frame
  );
  plate.position.set(midX, -1.0, -0.55);
  frame.add(plate);

  // brackets
  for (const p of [PARAMS.O2, PARAMS.O4]) {
    const bracket = new THREE.Mesh(
      new THREE.BoxGeometry(0.62, 1.25, 0.5),
      MAT.frame
    );
    bracket.position.set(p[0], -0.42, -0.32);
    frame.add(bracket);
    addPin(frame, p[0], p[1], 0.32, 1.30, MAT.pin, 0);
  }
}

addMarker(frame, 'frame@O2', PARAMS.O2[0], PARAMS.O2[1]);
addMarker(frame, 'frame@O4', PARAMS.O4[0], PARAMS.O4[1]);

/* ================================================================
   PART: crank  (local origin = O2, local +x along O2 -> A)
   ================================================================ */
const crank = new THREE.Object3D();
crank.name = 'crank';
scene.add(crank);

addBar(crank, 0, PARAMS.len.O2A, 0.48, 0.42, MAT.crank);
addPin(crank, 0, 0, 0.26, 0.95, MAT.pin);                  // at O2
addPin(crank, PARAMS.len.O2A, 0, 0.30, 1.10, MAT.pin);     // at A
addMarker(crank, 'crank@O2', 0, 0);
addMarker(crank, 'crank@A', PARAMS.len.O2A, 0);

/* ================================================================
   PART: coupler  (local origin = A, local +x along A -> B -> P)
   ================================================================ */
const coupler = new THREE.Object3D();
coupler.name = 'coupler';
scene.add(coupler);

addBar(coupler, 0, PARAMS.len.AB, 0.42, 0.36, MAT.coupler);            // A -> B
addBar(coupler, PARAMS.len.AB, PARAMS.len.AP, 0.26, 0.26, MAT.coupler); // B -> P extension
addPin(coupler, 0, 0, 0.34, 1.25, MAT.pin);                            // at A
addPin(coupler, PARAMS.len.AB, 0, 0.30, 1.10, MAT.pin);                // at B
{
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.27, 26, 18), MAT.trace);
  tip.position.set(PARAMS.len.AP, 0, 0);
  coupler.add(tip);
}

addMarker(coupler, 'coupler@A', 0, 0);
addMarker(coupler, 'coupler@B', PARAMS.len.AB, 0);
addMarker(coupler, 'coupler@P', PARAMS.len.AP, 0);

/* ================================================================
   PART: rocker  (local origin = O4, local +x along O4 -> B)
   ================================================================ */
const rocker = new THREE.Object3D();
rocker.name = 'rocker';
scene.add(rocker);

addBar(rocker, 0, PARAMS.len.O4B, 0.46, 0.40, MAT.rocker);
addPin(rocker, 0, 0, 0.26, 0.95, MAT.pin);                      // at O4
addPin(rocker, PARAMS.len.O4B, 0, 0.26, 0.95, MAT.pin);         // at B
addMarker(rocker, 'rocker@O4', 0, 0);
addMarker(rocker, 'rocker@B', PARAMS.len.O4B, 0);

/* ================================================================
   Decorative: traced coupler curve of P (static, deterministic)
   ================================================================ */
{
  const pts = [];
  const N = 720;
  for (let i = 0; i <= N; i++) {
    const th = (i / N) * Math.PI * 2;
    const s = solve(th);
    pts.push(new THREE.Vector3(s.P.x, s.P.y, -0.02));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({ color: 0x62b6ff, transparent: true, opacity: 0.42 })
  );
  scene.add(line);
}

/* ================================================================
   PANEL
   ================================================================ */
const elCrank = document.querySelector('[data-q="crank_deg"]');
const elPx    = document.querySelector('[data-q="P_x"]');
const elPy    = document.querySelector('[data-q="P_y"]');

/* ================================================================
   render(t)  — PURE function of time t (seconds)
   ================================================================ */
function render(t) {
  const theta = PARAMS.theta0 + PARAMS.omega * t;
  const s = solve(theta);

  // ---- crank (origin O2, local +x toward A)
  crank.position.set(PARAMS.O2[0], PARAMS.O2[1], 0);
  crank.rotation.set(0, 0, theta);

  // ---- coupler (origin A, local +x toward B)
  coupler.position.set(s.A.x, s.A.y, 0);
  coupler.rotation.set(0, 0, Math.atan2(s.B.y - s.A.y, s.B.x - s.A.x));

  // ---- rocker (origin O4, local +x toward B)
  rocker.position.set(PARAMS.O4[0], PARAMS.O4[1], 0);
  rocker.rotation.set(0, 0, Math.atan2(s.B.y - PARAMS.O4[1], s.B.x - PARAMS.O4[0]));

  // ---- panel
  const deg = ((theta * 180 / Math.PI) % 360 + 360) % 360;
  elCrank.textContent = deg.toFixed(1);
  elPx.textContent = s.P.x.toFixed(2);
  elPy.textContent = s.P.y.toFixed(2);

  // ---- draw
  scene.updateMatrixWorld(true);
  renderer.render(scene, camera);
}

/* ================================================================
   EXPORT
   ================================================================ */
const period = (Math.PI * 2) / Math.abs(PARAMS.omega);

window.SIM = {
  scene,
  camera,
  renderer,
  period,
  params: {
    O2: [PARAMS.O2[0], PARAMS.O2[1]],
    O4: [PARAMS.O4[0], PARAMS.O4[1]],
    len: {
      O2A: PARAMS.len.O2A,
      O4B: PARAMS.len.O4B,
      AB:  PARAMS.len.AB,
      AP:  PARAMS.len.AP
    },
    omega: PARAMS.omega,
    theta0: PARAMS.theta0
  },
  render
};

/* ---------------- initial pose + readiness ---------------- */
fitCamera();
render(0);
window.SIM_READY = true;

/* ---------------- live animation loop ---------------- */
if (location.search.indexOf('capture') === -1) {
  let t0 = null;
  const tick = (now) => {
    if (t0 === null) t0 = now;
    SIM.render((now - t0) / 1000);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------------- resize ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
});
</script>
</body>
</html>
