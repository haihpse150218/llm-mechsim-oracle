<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four-bar crank-rocker simulator</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:system-ui,sans-serif;color:#e8eef5}
canvas{display:block;position:fixed;left:0;top:0}
#panel{position:fixed;z-index:2;left:16px;top:16px;background:rgba(10,16,24,.78);padding:12px 16px;border-radius:8px;font-size:15px;line-height:1.7;min-width:230px}
#panel .lbl{display:inline-block;width:150px;color:#9fb6cc}
</style>
</head>
<body>
<div id="panel">
  <div><span class="lbl">Crank angle (O2-A)</span><span data-q="crank_deg">0.0</span>&deg;</div>
  <div><span class="lbl">Rocker angle (O4-B)</span><span data-q="rocker_deg">0.0</span>&deg;</div>
</div>

<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// Geometry (mm) and input speed. Grashof check: s+l = 40+130 = 170 <= p+q = 120+100 = 220,
// crank is shortest link, so this is a crank-rocker.
const P = { a: 40, b: 120, c: 100, d: 130, omega: 2.0, theta0: 0 };
const PERIOD = 2 * Math.PI / Math.abs(P.omega);

// Renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(65, 60, 470);
camera.lookAt(65, 60, 0);

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x202830, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(120, 200, 300);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-200, -100, 200);
scene.add(fill);

// Materials
const matFrame = new THREE.MeshStandardMaterial({ color: 0x7a8694, metalness: 0.4, roughness: 0.5 });
const matCrank = new THREE.MeshStandardMaterial({ color: 0xe0a030, metalness: 0.2, roughness: 0.4 });
const matCoupler = new THREE.MeshStandardMaterial({ color: 0x3fa7d6, metalness: 0.2, roughness: 0.4 });
const matRocker = new THREE.MeshStandardMaterial({ color: 0x6cc070, metalness: 0.2, roughness: 0.4 });
const matPin = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.25 });

// Helpers
function makeBar(len, mat, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, 14, 8), mat);
  m.position.set(len / 2, 0, z);
  return m;
}
function makePin(x, y, z) {
  const g = new THREE.CylinderGeometry(7, 7, 34, 24);
  g.rotateX(Math.PI / 2); // axis along Z
  const m = new THREE.Mesh(g, matPin);
  m.position.set(x, y, z);
  return m;
}
function marker(name, x, y) {
  const o = new THREE.Object3D();
  o.name = name;
  o.position.set(x, y, 0);
  return o;
}

// Parts (each is an Object3D; markers are children placed at their points)
const frame = new THREE.Object3D();
frame.name = 'frame';
{
  const ground = new THREE.Mesh(new THREE.BoxGeometry(P.d + 40, 12, 10), matFrame);
  ground.position.set(P.d / 2, -28, -16);
  frame.add(ground);
  frame.add(makePin(0, 0, -16), makePin(P.d, 0, -16));
  frame.add(marker('frame@O2', 0, 0), marker('frame@O4', P.d, 0));
}

const crank = new THREE.Object3D();   // origin at O2
crank.name = 'crank';
crank.add(makeBar(P.a, matCrank, 0));
crank.add(makePin(0, 0, 0), makePin(P.a, 0, 0));
crank.add(marker('crank@O2', 0, 0), marker('crank@A', P.a, 0));

const coupler = new THREE.Object3D(); // origin at A
coupler.name = 'coupler';
coupler.add(makeBar(P.b, matCoupler, 8));
coupler.add(makePin(0, 0, 0), makePin(P.b, 0, 0));
coupler.add(marker('coupler@A', 0, 0), marker('coupler@B', P.b, 0));

const rocker = new THREE.Object3D();  // origin at O4
rocker.name = 'rocker';
rocker.position.set(P.d, 0, 0);
rocker.add(makeBar(P.c, matRocker, -8));
rocker.add(makePin(0, 0, 0), makePin(P.c, 0, 0));
rocker.add(marker('rocker@B', P.c, 0), marker('rocker@O4', 0, 0));

// The rocker origin sits at O4 in world space, so its child positions are local offsets from O4.
// Rocker markers are placed in local coordinates relative to that origin, so the geometry is consistent.
scene.add(frame, crank, coupler, rocker);

const panelEls = {
  crank_deg: document.querySelector('[data-q="crank_deg"]'),
  rocker_deg: document.querySelector('[data-q="rocker_deg"]'),
};

// Pure kinematics: closed-form circle intersection, branch with B above the O2-O4 line.
function solve(t) {
  const th = P.theta0 + P.omega * t;
  const Ax = P.a * Math.cos(th), Ay = P.a * Math.sin(th);
  const dx = P.d - Ax, dy = -Ay;               // vector A -> O4
  const D = Math.hypot(dx, dy);
  const x = (P.b * P.b - P.c * P.c + D * D) / (2 * D);
  const h = Math.sqrt(Math.max(0, P.b * P.b - x * x));
  const mx = Ax + x * dx / D, my = Ay + x * dy / D;
  const px = Ay / D, py = dx / D;              // unit perpendicular (-dy, dx)/D
  const Bx = mx + h * px, By = my + h * py;
  const phi = Math.atan2(By - Ay, Bx - Ax);    // coupler direction A->B
  const psi = Math.atan2(By, Bx - P.d);        // rocker direction O4->B
  return { th, Ax, Ay, Bx, By, phi, psi };
}

const TAU_DEG = 180 / Math.PI;
const norm360 = (rad) => ((rad * TAU_DEG) % 360 + 360) % 360;

function render(t) {
  const s = solve(t);
  crank.rotation.z = s.th;
  coupler.position.set(s.Ax, s.Ay, 0);
  coupler.rotation.z = s.phi;
  rocker.rotation.z = s.psi;

  const cd = norm360(s.th), rd = norm360(s.psi);
  panelEls.crank_deg.textContent = cd.toFixed(1);
  panelEls.rocker_deg.textContent = rd.toFixed(1);

  renderer.render(scene, camera);
}

window.SIM = {
  scene,
  camera,
  renderer,
  period: PERIOD,
  params: { a: P.a, b: P.b, c: P.c, d: P.d, omega: P.omega, theta0: P.theta0 },
  render,
};
render(0);
window.SIM_READY = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Live loop unless capturing
if (!location.search.includes('capture')) {
  const start = performance.now();
  const loop = () => {
    SIM.render((performance.now() - start) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
