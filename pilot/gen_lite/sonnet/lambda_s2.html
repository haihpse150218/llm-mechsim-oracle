<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chebyshev lambda linkage</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14171c;font-family:sans-serif}
canvas{display:block}
#panel{position:absolute;left:12px;top:12px;color:#e8edf2;background:rgba(20,24,30,.75);padding:10px 14px;border-radius:6px;font-size:14px;line-height:1.6}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head><body>
<div id="panel"><b>Chebyshev lambda linkage</b>
<div>crank angle: <span data-q="crank_deg">0</span> deg</div>
<div>P x: <span data-q="P_x">0</span> mm</div>
<div>P y: <span data-q="P_y">0</span> mm</div></div>
<script type="module">
import * as THREE from 'three';
const params={O2:[0,0],O4:[80,0],len:{O2A:40,O4B:100,AB:100,AP:200},omega:1.2,theta0:0.5};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14171c);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,1,5000);
camera.position.set(40,110,650);camera.lookAt(40,110,0);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(200,300,500);scene.add(dl);

function bar(len,w,t,color,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(len+w,w,t),new THREE.MeshStandardMaterial({color,metalness:0.3,roughness:0.5}));
  m.position.set(len/2,0,z);return m;}
function pin(r,h,color,x,y,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),new THREE.MeshStandardMaterial({color,metalness:0.5,roughness:0.4}));
  m.rotation.x=Math.PI/2;m.position.set(x,y,z);return m;}
function mk(parent,name,x,y){const o=new THREE.Object3D();o.name=name;o.position.set(x,y,0);parent.add(o);}
function grp(name){const g=new THREE.Object3D();g.name=name;scene.add(g);return g;}

const L=params.len,O2=params.O2,O4=params.O4;
const frame=grp('frame');
frame.add(pin(9,30,0x888f99,O2[0],O2[1],-8));
frame.add(pin(9,30,0x888f99,O4[0],O4[1],-8));
const base=new THREE.Mesh(new THREE.BoxGeometry(O4[0]-O2[0]+40,10,6),new THREE.MeshStandardMaterial({color:0x555c66}));
base.position.set((O2[0]+O4[0])/2,-14,-20);frame.add(base);
mk(frame,'frame@O2',O2[0],O2[1]);mk(frame,'frame@O4',O4[0],O4[1]);

const crank=grp('crank');
crank.add(bar(L.O2A,12,6,0xd9534f,4));
crank.add(pin(8,10,0xcccccc,0,0,4));crank.add(pin(8,10,0xcccccc,L.O2A,0,4));
mk(crank,'crank@O2',0,0);mk(crank,'crank@A',L.O2A,0);

const coupler=grp('coupler');
coupler.add(bar(L.AP,10,5,0x3b82c4,14));
coupler.add(pin(7,8,0xcccccc,0,0,14));coupler.add(pin(7,8,0xcccccc,L.AB,0,14));
const tip=new THREE.Mesh(new THREE.SphereGeometry(8,20,16),new THREE.MeshStandardMaterial({color:0xffd23f}));
tip.position.set(L.AP,0,14);coupler.add(tip);
mk(coupler,'coupler@A',0,0);mk(coupler,'coupler@B',L.AB,0);mk(coupler,'coupler@P',L.AP,0);

const rocker=grp('rocker');
rocker.add(bar(L.O4B,12,6,0x5cb85c,24));
rocker.add(pin(8,10,0xcccccc,0,0,24));rocker.add(pin(8,10,0xcccccc,L.O4B,0,24));
mk(rocker,'rocker@O4',0,0);mk(rocker,'rocker@B',L.O4B,0);

const qCrank=document.querySelector('[data-q="crank_deg"]');
const qX=document.querySelector('[data-q="P_x"]');
const qY=document.querySelector('[data-q="P_y"]');

function render(t){
  const th=params.theta0+params.omega*t;
  const ax=O2[0]+L.O2A*Math.cos(th),ay=O2[1]+L.O2A*Math.sin(th);
  const dx=O4[0]-ax,dy=O4[1]-ay,d=Math.hypot(dx,dy);
  const mx=(ax+O4[0])/2,my=(ay+O4[1])/2;
  const h=Math.sqrt(Math.max(0,L.AB*L.AB-d*d/4));
  const nx=-dy/d,ny=dx/d;
  const bx=mx+h*nx,by=my+h*ny;
  const px=ax+(bx-ax)*L.AP/L.AB,py=ay+(by-ay)*L.AP/L.AB;
  crank.position.set(O2[0],O2[1],0);crank.rotation.set(0,0,th);
  coupler.position.set(ax,ay,0);coupler.rotation.set(0,0,Math.atan2(by-ay,bx-ax));
  rocker.position.set(O4[0],O4[1],0);rocker.rotation.set(0,0,Math.atan2(by-O4[1],bx-O4[0]));
  let deg=((th*180/Math.PI)%360+360)%360;
  qCrank.textContent=deg.toFixed(1);
  qX.textContent=px.toFixed(2);
  qY.textContent=py.toFixed(2);
  scene.updateMatrixWorld(true);
  renderer.render(scene,camera);
}
window.SIM={scene,camera,renderer,period:2*Math.PI/params.omega,params,render};
render(0);
window.SIM_READY=true;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
if(!location.search.includes('capture')){
  const t0=performance.now();
  (function loop(){SIM.render((performance.now()-t0)/1000);requestAnimationFrame(loop);})();
}
</script>
</body></html>
