<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>External Geneva drive</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f27;font-family:sans-serif}
canvas{display:block}
#panel{position:fixed;left:12px;top:12px;background:rgba(0,0,0,.6);color:#e8eef8;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.6}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="panel">
Driver angle: <span data-q="driver_deg">0</span> deg<br>
Wheel angle: <span data-q="wheel_deg">0</span> deg
</div>
<script type="module">
import * as THREE from 'three';

const n = 6, C = 100, a = C * Math.sin(Math.PI / n);
const omega = 1.0, phi0 = -2.0;
const R = 92, rIn = 40, hw = 5.6, rd = 42, pinR = 5, T = 8;
const TWO_PI = Math.PI * 2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f27);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(50, -140, 330);
camera.lookAt(50, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(120, -150, 300);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0x88aaff, 0.4);
dl2.position.set(-200, 150, 100);
scene.add(dl2);

function mat(c) { return new THREE.MeshStandardMaterial({ color: c, metalness: 0.4, roughness: 0.5 }); }
function marker(parent, name, x, y, z) {
  const o = new THREE.Object3D(); o.name = name; o.position.set(x || 0, y || 0, z || 0); parent.add(o); return o;
}
function cyl(r, h, z, m) {
  const g = new THREE.CylinderGeometry(r, r, h, 40);
  g.rotateX(Math.PI / 2);
  const me = new THREE.Mesh(g, m); me.position.z = z; return me;
}

// ---- frame
const frame = new THREE.Object3D(); frame.name = 'frame'; scene.add(frame);
const plate = new THREE.Mesh(new THREE.BoxGeometry(C + 160, 150, 6), mat(0x3a4252));
plate.position.set(C / 2, 0, -12);
frame.add(plate);
frame.add(cyl(7, 14, -6, mat(0x9aa4b5)));
{ const s = cyl(7, 14, -6, mat(0x9aa4b5)); s.position.x = C; frame.add(s); }
marker(frame, 'frame@O', 0, 0, 0);
marker(frame, 'frame@W', C, 0, 0);

// ---- driver (pin along local +x)
const driver = new THREE.Object3D(); driver.name = 'driver'; scene.add(driver);
{
  const sh = new THREE.Shape();
  const cut = 62 * Math.PI / 180;
  sh.moveTo(0, 0);
  sh.lineTo(rd * Math.cos(cut), rd * Math.sin(cut));
  sh.absarc(0, 0, rd, cut, TWO_PI - cut, false);
  sh.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(sh, { depth: T, bevelEnabled: false });
  g.translate(0, 0, -T / 2);
  driver.add(new THREE.Mesh(g, mat(0xd9822b)));
  // arm
  const arm = new THREE.Mesh(new THREE.BoxGeometry(a + 10, 10, 4), mat(0xd9822b));
  arm.position.set(a / 2, 0, 6);
  driver.add(arm);
  driver.add(cyl(8, 12, 5, mat(0xd9822b)));
  const pin = cyl(pinR, 16, 3, mat(0xe8e8e8));
  pin.position.x = a; driver.add(pin);
  marker(driver, 'driver@O', 0, 0, 0);
  marker(driver, 'driver@pin', a, 0, 0);
}

// ---- wheel (slot 0 along local +x)
const wheel = new THREE.Object3D(); wheel.name = 'wheel'; wheel.position.set(C, 0, 0); scene.add(wheel);
{
  const rc = rd + 0.8;
  const pts = [];
  const P = (ang, x, y) => {
    const c = Math.cos(ang), s = Math.sin(ang);
    return new THREE.Vector2(c * x - s * y, s * x + c * y);
  };
  const xr = Math.sqrt(R * R - hw * hw);
  for (let k = 0; k < n; k++) {
    const ak = TWO_PI * k / n;
    pts.push(P(ak, xr, -hw));
    pts.push(P(ak, rIn, -hw));
    pts.push(P(ak, rIn, hw));
    pts.push(P(ak, xr, hw));
    const mid = ak + Math.PI / n;
    const half = Math.PI / n - hw / R;
    const N = 28;
    for (let i = 0; i <= N; i++) {
      const d = -half + 2 * half * i / N;
      let r = R;
      const disc = rc * rc - C * C * Math.sin(d) * Math.sin(d);
      if (disc >= 0) r = Math.min(R, C * Math.cos(d) - Math.sqrt(disc));
      pts.push(P(mid + d, r, 0));
    }
  }
  const sh = new THREE.Shape(pts);
  const hole = new THREE.Path(); hole.absarc(0, 0, 9, 0, TWO_PI, true);
  sh.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(sh, { depth: T, bevelEnabled: false });
  g.translate(0, 0, -T / 2);
  wheel.add(new THREE.Mesh(g, mat(0x3f8fd6)));
  wheel.add(cyl(11, 12, 0, mat(0x2d6aa0)));
  marker(wheel, 'wheel@W', 0, 0, 0);
  for (let j = 0; j < n; j++) {
    const ang = TWO_PI * j / n;
    marker(wheel, 'wheel@s' + j, 80 * Math.cos(ang), 80 * Math.sin(ang), 0);
  }
}

// ---- kinematics
const mod360 = d => ((d % 360) + 360) % 360;
const qD = document.querySelector('[data-q="driver_deg"]');
const qW = document.querySelector('[data-q="wheel_deg"]');
const thE = Math.PI / 2 - Math.PI / n;

function wheelAngle(phi) {
  const m = Math.floor((phi + Math.PI) / TWO_PI);
  const th = phi - TWO_PI * m; // in [-pi, pi)
  let g;
  if (th <= -thE) g = 0;
  else if (th >= thE) g = -TWO_PI / n;
  else g = -Math.atan2(a * Math.sin(th), C - a * Math.cos(th)) - Math.PI / n;
  return Math.PI + Math.PI / n - TWO_PI / n * m + g;
}

function render(t) {
  const phi = phi0 + omega * t;
  const w = wheelAngle(phi);
  driver.rotation.z = phi;
  wheel.rotation.z = w;
  qD.textContent = mod360(phi * 180 / Math.PI).toFixed(2) + ' deg';
  qW.textContent = mod360(w * 180 / Math.PI).toFixed(2) + ' deg';
  renderer.render(scene, camera);
}

window.SIM = {
  scene, camera, renderer,
  period: TWO_PI / omega,
  params: { n, C, a, omega, phi0 },
  render
};
window.SIM_READY = true;

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  render(window.__lastT || 0);
});

render(0);
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  const loop = () => {
    const t = (performance.now() - t0) / 1000;
    window.__lastT = t;
    SIM.render(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
