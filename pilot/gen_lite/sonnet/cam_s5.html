<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Disk cam with roller follower</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15181d;font-family:sans-serif}
canvas{display:block}
#panel{position:fixed;left:12px;top:12px;background:rgba(0,0,0,.6);color:#eee;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.6}
#panel span{font-weight:bold;color:#7fd}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head><body>
<div id="panel">
<div>Cam angle: <span data-q="cam_deg">0</span> deg</div>
<div>Lift: <span data-q="lift">0</span> mm</div>
</div>
<script type="module">
import * as THREE from 'three';

const TWO_PI = Math.PI * 2;
const params = {
  Rb: 40, Rr: 10, e: 10, h: 20,
  axisAngle: Math.PI / 2,
  betaRise: 2 * Math.PI / 3, betaDwellTop: Math.PI / 3,
  betaReturn: 2 * Math.PI / 3, betaDwellBottom: Math.PI / 3,
  omega: 1.2,
  theta0: 0.5
};
const P = params;
const period = TWO_PI / P.omega;
const a = P.axisAngle;
const u = new THREE.Vector2(Math.cos(a), Math.sin(a));
const nrm = new THREE.Vector2(-Math.sin(a), Math.cos(a));
const Rp = P.Rb + P.Rr;
const s0 = Math.sqrt(Rp * Rp - P.e * P.e);
const STEM = 40;

// lift and its derivative wrt cam rotation psi
function liftAt(psi) {
  const p = ((psi % TWO_PI) + TWO_PI) % TWO_PI;
  const b1 = P.betaRise, b2 = b1 + P.betaDwellTop, b3 = b2 + P.betaReturn;
  if (p < b1) { const x = p / b1; return [P.h * (x - Math.sin(TWO_PI * x) / TWO_PI), P.h * (1 - Math.cos(TWO_PI * x)) / b1]; }
  if (p < b2) return [P.h, 0];
  if (p < b3) { const x = (p - b2) / P.betaReturn; return [P.h * (1 - x + Math.sin(TWO_PI * x) / TWO_PI), -P.h * (1 - Math.cos(TWO_PI * x)) / P.betaReturn]; }
  return [0, 0];
}
function rot(v, ang) { const c = Math.cos(ang), s = Math.sin(ang); return new THREE.Vector2(c * v.x - s * v.y, s * v.x + c * v.y); }
function rollerWorld(lift) { return nrm.clone().multiplyScalar(P.e).add(u.clone().multiplyScalar(s0 + lift)); }

// exact cam surface (cam-local frame): offset of the pitch curve inward by Rr
function profilePoints(N) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const psi = TWO_PI * i / N;
    const [l, dl] = liftAt(psi);
    const Cw = rollerWorld(l);
    const th = P.theta0 + psi;
    // pitch-curve tangent (world-rotated): lift' * u - J*Cw
    const Tw = u.clone().multiplyScalar(dl).add(new THREE.Vector2(Cw.y, -Cw.x)); // -J Cw = (Cw.y, -Cw.x)
    Tw.normalize();
    const out = new THREE.Vector2(-Tw.y, Tw.x); // J Tw : outward normal
    const S = Cw.clone().addScaledVector(out, -P.Rr);
    pts.push(rot(S, -th));
  }
  return pts;
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15181d);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(40, 0, 330);
camera.lookAt(0, 30, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dl = new THREE.DirectionalLight(0xffffff, 1.0);
dl.position.set(100, 150, 250);
scene.add(dl);

const matSteel = new THREE.MeshStandardMaterial({ color: 0x8a96a8, metalness: 0.5, roughness: 0.4 });
const matCam = new THREE.MeshStandardMaterial({ color: 0xd6a84a, metalness: 0.4, roughness: 0.45 });
const matFol = new THREE.MeshStandardMaterial({ color: 0x4aa3d6, metalness: 0.3, roughness: 0.5 });
const matRoll = new THREE.MeshStandardMaterial({ color: 0xd65a4a, metalness: 0.3, roughness: 0.5 });
const matFrame = new THREE.MeshStandardMaterial({ color: 0x4a5160, metalness: 0.2, roughness: 0.7 });

// frame
const frame = new THREE.Object3D(); frame.name = 'frame';
scene.add(frame);
{
  const back = new THREE.Mesh(new THREE.BoxGeometry(220, 220, 4), matFrame);
  back.position.set(0, 25, -16); frame.add(back);
  const gpos = nrm.clone().multiplyScalar(P.e).add(u.clone().multiplyScalar(s0 + 45));
  for (const z of [-9, 9]) {
    const cheek = new THREE.Mesh(new THREE.BoxGeometry(24, 18, 6), matFrame);
    cheek.position.set(gpos.x, gpos.y, z);
    cheek.rotation.z = a - Math.PI / 2 + Math.PI / 2; // long side along line of motion
    cheek.rotation.z = a; cheek.geometry.dispose();
    cheek.geometry = new THREE.BoxGeometry(24, 18, 6);
    frame.add(cheek);
  }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(24, 18, 24), matFrame);
  bar.visible = false; frame.add(bar);
  const G = new THREE.Object3D(); G.name = 'frame@G';
  G.position.set(gpos.x, gpos.y, 0); frame.add(G);
  const O = new THREE.Object3D(); O.name = 'frame@O'; frame.add(O);
  const bearing = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 10, 32), matSteel);
  bearing.rotation.x = Math.PI / 2; bearing.position.z = -11; frame.add(bearing);
}

// cam
const cam = new THREE.Object3D(); cam.name = 'cam';
scene.add(cam);
{
  const pts = profilePoints(720);
  const shape = new THREE.Shape(pts);
  const hole = new THREE.Path(); hole.absarc(0, 0, 6, 0, TWO_PI, true); shape.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 10, bevelEnabled: false, curveSegments: 8 });
  g.translate(0, 0, -5);
  cam.add(new THREE.Mesh(g, matCam));
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 24, 24), matSteel);
  shaft.rotation.x = Math.PI / 2; cam.add(shaft);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 11), matRoll);
  mark.position.set(P.Rb - 8, 0, 0); cam.add(mark);
  const O = new THREE.Object3D(); O.name = 'cam@O'; cam.add(O);
  const R = new THREE.Object3D(); R.name = 'cam@camRef'; R.position.set(P.Rb, 0, 0); cam.add(R);
}

// follower
const follower = new THREE.Object3D(); follower.name = 'follower';
scene.add(follower);
{
  const roller = new THREE.Mesh(new THREE.CylinderGeometry(P.Rr, P.Rr, 12, 40), matRoll);
  roller.rotation.x = Math.PI / 2; follower.add(roller);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 16, 16), matSteel);
  pin.rotation.x = Math.PI / 2; follower.add(pin);
  const stem = new THREE.Mesh(new THREE.BoxGeometry(STEM, 6, 6), matFol);
  stem.rotation.z = a;
  stem.position.set(u.x * STEM / 2, u.y * STEM / 2, 0); follower.add(stem);
  const C = new THREE.Object3D(); C.name = 'follower@C'; follower.add(C);
  const F = new THREE.Object3D(); F.name = 'follower@F'; F.position.set(u.x * STEM, u.y * STEM, 0); follower.add(F);
}

const elDeg = document.querySelector('[data-q="cam_deg"]');
const elLift = document.querySelector('[data-q="lift"]');

function render(t) {
  const psi = P.omega * t;
  const theta = P.theta0 + psi;
  cam.rotation.z = theta;
  const [l] = liftAt(psi);
  const Cw = rollerWorld(l);
  follower.position.set(Cw.x, Cw.y, 0);
  const deg = (((theta * 180 / Math.PI) % 360) + 360) % 360;
  elDeg.textContent = deg.toFixed(1);
  elLift.textContent = l.toFixed(2);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  render(window.__lastT || 0);
});

window.SIM = { scene, camera, renderer, period, params: P, render };
render(0);
window.SIM_READY = true;

if (!location.search.includes('capture')) {
  const start = performance.now();
  const loop = () => {
    const t = (performance.now() - start) / 1000;
    window.__lastT = t;
    SIM.render(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body></html>
