<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chebyshev Lambda Linkage Simulator</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #0e0e14; font-family: monospace; }
  canvas { display: block; }
  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: rgba(0, 0, 0, 0.68);
    color: #eee;
    padding: 10px 14px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
    font-size: 14px;
    line-height: 1.6;
  }
  #panel span {
    color: #ffd166;
    font-weight: 600;
  }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<div id="panel">
  <div>crank_deg <span data-q="crank_deg">0.00</span></div>
  <div>P_x <span data-q="P_x">0.00</span></div>
  <div>P_y <span data-q="P_y">0.00</span></div>
</div>

<script type="module">
import * as THREE from 'three';

const params = {
  O2: [0, 0],
  O4: [200, 0],
  len: {
    O2A: 500,
    O4B: 400,
    AB: 500,
    AP: 250
  },
  omega: 1,
  theta0: 0
};

const L = params.len;
const O2 = params.O2;
const O4 = params.O4;
const groundLength = Math.hypot(O4[0] - O2[0], O4[1] - O2[1]);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14141e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 8000);
camera.position.set(0, -250, 1700);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
keyLight.position.set(800, 1000, 1400);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xaaccff, 0.7);
fillLight.position.set(-600, -400, 900);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(200, 800, -800);
scene.add(rimLight);

const material = {
  frame: new THREE.MeshStandardMaterial({ color: 0x888c99, roughness: 0.55, metalness: 0.5 }),
  crank: new THREE.MeshStandardMaterial({ color: 0x3a86ff, roughness: 0.38, metalness: 0.35 }),
  coupler: new THREE.MeshStandardMaterial({ color: 0x2dc653, roughness: 0.35, metalness: 0.25 }),
  rocker: new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.38, metalness: 0.3 }),
  tracer: new THREE.MeshStandardMaterial({ color: 0xffd42a, roughness: 0.3, metalness: 0.15, emissive: 0x331d00 })
};

function addBar(part, length, width, thickness, mat) {
  const geo = new THREE.BoxGeometry(length, width, thickness);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(length / 2, 0, 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  part.add(mesh);
}

function addMarker(part, name, x, y) {
  const marker = new THREE.Object3D();
  marker.name = name;
  marker.position.set(x, y, 0);
  part.add(marker);
  return marker;
}

const partFrame = new THREE.Object3D();
partFrame.name = 'frame';
scene.add(partFrame);

const partCrank = new THREE.Object3D();
partCrank.name = 'crank';
scene.add(partCrank);

const partCoupler = new THREE.Object3D();
partCoupler.name = 'coupler';
scene.add(partCoupler);

const partRocker = new THREE.Object3D();
partRocker.name = 'rocker';
scene.add(partRocker);

addBar(partFrame, groundLength, 30, 26, material.frame);
addBar(partCrank, L.O2A, 22, 18, material.crank);
addBar(partCoupler, L.AB, 18, 14, material.coupler);
addBar(partRocker, L.O4B, 22, 18, material.rocker);

addMarker(partFrame, 'frame@O2', 0, 0);
addMarker(partFrame, 'frame@O4', groundLength, 0);

addMarker(partCrank, 'crank@O2', 0, 0);
addMarker(partCrank, 'crank@A', L.O2A, 0);

addMarker(partCoupler, 'coupler@A', 0, 0);
addMarker(partCoupler, 'coupler@B', L.AB, 0);
const tracerMarker = addMarker(partCoupler, 'coupler@P', L.AP, 0);

const tracerSphere = new THREE.Mesh(new THREE.SphereGeometry(15, 24, 24), material.tracer);
tracerSphere.position.set(0, 0, 0);
tracerMarker.add(tracerSphere);

addMarker(partRocker, 'rocker@O4', 0, 0);
addMarker(partRocker, 'rocker@B', L.O4B, 0);

const frameAngle = Math.atan2(O4[1] - O2[1], O4[0] - O2[0]);
partFrame.position.set(O2[0], O2[1], 0);
partFrame.rotation.z = frameAngle;

function setPanel(name, value) {
  const el = document.querySelector(`[data-q="${name}"]`);
  if (el) el.textContent = value;
}

function render(t) {
  const theta = params.theta0 + params.omega * t;

  const ax = O2[0] + L.O2A * Math.cos(theta);
  const ay = O2[1] + L.O2A * Math.sin(theta);
  const A = { x: ax, y: ay };

  const ex = ax - O4[0];
  const ey = ay - O4[1];
  const dA = Math.hypot(ex, ey);

  const cosDelta = (dA * dA + L.O4B * L.O4B - L.AB * L.AB) / (2 * dA * L.O4B);
  const delta = Math.acos(Math.max(-1, Math.min(1, cosDelta)));
  const sinDelta = Math.sin(delta);

  const ux = ex / dA;
  const uy = ey / dA;

  const bx = O4[0] + L.O4B * (ux * cosDelta - uy * sinDelta);
  const by = O4[1] + L.O4B * (ux * sinDelta + uy * cosDelta);
  const B = { x: bx, y: by };

  const lambda = L.AP / L.AB;
  const px = A.x + lambda * (B.x - A.x);
  const py = A.y + lambda * (B.y - A.y);
  const P = { x: px, y: py };

  partCrank.position.set(O2[0], O2[1], 0);
  partCrank.rotation.z = theta;

  partRocker.position.set(O4[0], O4[1], 0);
  partRocker.rotation.z = Math.atan2(B.y - O4[1], B.x - O4[0]);

  partCoupler.position.set(A.x, A.y, 0);
  partCoupler.rotation.z = Math.atan2(B.y - A.y, B.x - A.x);

  partFrame.position.set(O2[0], O2[1], 0);
  partFrame.rotation.z = frameAngle;

  const crankDeg = ((theta * 180 / Math.PI) % 360 + 360) % 360;
  setPanel('crank_deg', crankDeg.toFixed(2));
  setPanel('P_x', P.x.toFixed(2));
  setPanel('P_y', P.y.toFixed(2));

  renderer.render(scene, camera);
}

window.SIM = {
  scene,
  camera,
  renderer,
  period: (2 * Math.PI) / params.omega,
  params,
  render
};
window.SIM_READY = true;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

if (!/[\?&]capture/.test(location.search)) {
  const start = performance.now();
  function animate() {
    const elapsed = (performance.now() - start) / 1000;
    window.SIM.render(elapsed);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
