<!doctype html>
<html><head><meta charset="utf-8"><title>Four-bar (reference)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#15181d;font-family:system-ui,sans-serif}
#panel{position:fixed;top:12px;left:12px;color:#e8e8e8;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.6}
#panel b{color:#9fd3ff}</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head><body>
<div id="panel"><div><b>Four-bar crank-rocker</b></div>
<div>crank: <span data-q="crank_deg">0</span></div>
<div>rocker: <span data-q="rocker_deg">0</span></div></div>
<script type="module">
import * as THREE from 'three';
const A_ = 40, B_ = 120, C_ = 80, D_ = 100, PERIOD = 4;
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15181d);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 5000);
camera.position.set(50, 40, 420);
camera.lookAt(50, 40, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(100, 200, 300);
scene.add(sun);
const mat = (c) => new THREE.MeshStandardMaterial({color: c, metalness: 0.4, roughness: 0.45});
function bar(len, w, th, color) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, w, th), mat(color));
  m.position.x = len / 2;
  g.add(m);
  for (const x of [0, len]) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.6, w * 0.6, th + 2, 24), mat(0xdddddd));
    c.rotation.x = Math.PI / 2;
    c.position.x = x;
    g.add(c);
  }
  return g;
}
const ground = new THREE.Mesh(new THREE.BoxGeometry(D_ + 40, 8, 20), mat(0x3a3f47));
ground.position.set(D_ / 2, -16, -15);
scene.add(ground);
for (const x of [0, D_]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(16, 24, 12), mat(0x555b66));
  p.position.set(x, -6, -12);
  scene.add(p);
}
const crank = bar(A_, 12, 8, 0xd9822b); crank.name = 'crank'; scene.add(crank);
const coupler = bar(B_, 10, 8, 0x4f8fd6); coupler.name = 'coupler'; scene.add(coupler);
const rocker = bar(C_, 12, 8, 0x5cbf73); rocker.name = 'rocker'; scene.add(rocker);

function solve(th) {
  const ax = A_ * Math.cos(th), ay = A_ * Math.sin(th);
  const dx = D_ - ax, dy = -ay, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
  const aa = (B_ * B_ - C_ * C_ + l * l) / (2 * l), h = Math.sqrt(Math.max(0, B_ * B_ - aa * aa));
  return {ax, ay, bx: ax + aa * ux - h * uy, by: ay + aa * uy + h * ux};
}
const q = (k) => document.querySelector(`[data-q="${k}"]`);
const wrap = (d) => ((d % 360) + 360) % 360;
function render(t) {
  const th = (2 * Math.PI * t) / PERIOD;
  const {ax, ay, bx, by} = solve(th);
  crank.rotation.z = th;
  coupler.position.set(ax, ay, 9);
  coupler.rotation.z = Math.atan2(by - ay, bx - ax);
  rocker.position.set(D_, 0, 0);
  const rk = Math.atan2(by, bx - D_);
  rocker.rotation.z = rk + 0.26;
  q('crank_deg').textContent = `${wrap((th * 180) / Math.PI).toFixed(1)}°`;
  q('rocker_deg').textContent = `${wrap((rk * 180) / Math.PI).toFixed(1)}°`;
  renderer.render(scene, camera);
  return {};
}
window.SIM = {scene, camera, renderer, period: PERIOD, render};
window.SIM_READY = true;
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  const loop = () => { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script></body></html>
